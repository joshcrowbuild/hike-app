# Render Blueprint — Adventure Planner API (FastAPI on a Docker web service).
#
# Apply from the Render dashboard: New → Blueprint → connect this repo → Apply.
# Secrets are NOT in this file (CLAUDE.md rule #10); each `sync: false` var is a
# placeholder you fill in Render's dashboard at deploy time. The non-secret CORS
# origin is set here so the Vercel frontend is allowed out of the box.
#
# Full click-path (connect repo, paste Aura creds, deploy, verify /health):
# docs/runbooks/deploy-api-render.md
services:
  - type: web
    name: adventure-planner-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render gates deploy cutover on this path. /health answers 503 until the API
    # has warmed the whole /plan dependency stack (Neo4j driver connectivity,
    # provider SDK clients, the live-adapter registry — no tokens spent) and 200
    # after, so traffic never cuts over to an instance whose first /plan would eat
    # a cold init as a 500. A genuinely-down dependency keeps this 503 with its
    # cause in the detail (warm-up budget: ADVENTURE_WARMUP_DEADLINE_S, 30s) while
    # the previous instance keeps serving.
    healthCheckPath: /health
    # Deploy on every commit to the linked branch (current spec; replaces the
    # deprecated `autoDeploy: true`). Use `checksPass` to gate on CI, `off` to disable.
    autoDeployTrigger: commit
    envVars:
      # Non-secret: the browser origin(s) allowed to call the API (the Vercel app).
      # Without this the browser blocks every cross-origin request. Default-deny if
      # unset — so it is set explicitly here.
      - key: ADVENTURE_CORS_ALLOW_ORIGINS
        value: https://hike-app.vercel.app
      # Model providers (non-secret). The default is a LOCAL OpenAI endpoint a Render
      # box can't reach, so /plan would 500 once it needs a model. Point both tiers at
      # Anthropic (the API key below). Cheap tier = Haiku, judgment tier = Sonnet.
      - key: ADVENTURE_PROVIDER_MECHANICAL
        value: anthropic
      - key: ADVENTURE_PROVIDER_JUDGMENT
        value: anthropic
      - key: ADVENTURE_MODEL_MECHANICAL
        value: claude-haiku-4-5-20251001
      - key: ADVENTURE_MODEL_JUDGMENT
        value: claude-sonnet-4-6
      # Optional per-ROLE overrides layered on top of the tiers above
      # (orchestration/providers/registry.py resolve(); Epic 040 operator-lever
      # seam). Unset = the role resolves on its tier exactly as configured above
      # — "one mechanism, not a curate special-case," so the same three knobs
      # exist per role (extract/normalize share the mechanical tier; judge/curate
      # share judgment). The one named in Epic 040 as the phase-1 budget's
      # biggest lever is ADVENTURE_MODEL_CURATE (pin curate to a cheaper/faster
      # model than judge's eval-quality model without moving judge). Dashboard-
      # managed; leave unset unless deliberately tuning a role.
      - key: ADVENTURE_PROVIDER_EXTRACT
        sync: false
      - key: ADVENTURE_MODEL_EXTRACT
        sync: false
      - key: ADVENTURE_LOCAL_MODEL_EXTRACT
        sync: false
      - key: ADVENTURE_PROVIDER_NORMALIZE
        sync: false
      - key: ADVENTURE_MODEL_NORMALIZE
        sync: false
      - key: ADVENTURE_LOCAL_MODEL_NORMALIZE
        sync: false
      - key: ADVENTURE_PROVIDER_JUDGE
        sync: false
      - key: ADVENTURE_MODEL_JUDGE
        sync: false
      - key: ADVENTURE_LOCAL_MODEL_JUDGE
        sync: false
      - key: ADVENTURE_PROVIDER_CURATE
        sync: false
      - key: ADVENTURE_MODEL_CURATE
        sync: false
      - key: ADVENTURE_LOCAL_MODEL_CURATE
        sync: false
      # ── Injected in the Render dashboard (never committed) ──
      # Anthropic key — required because both tiers are set to the anthropic provider.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Neo4j Aura connection (e.g. NEO4J_URI=neo4j+s://<id>.databases.neo4j.io).
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      # Edge viewer-auth shared secret (Epic 014) — must equal the value the frontend
      # sends as X-Dev-Viewer-Secret. Absent → only anonymous browsing works (fail
      # closed); a non-anonymous viewer_id is rejected with 403.
      - key: ADVENTURE_DEV_VIEWER_SECRET
        sync: false
      # ── Live-condition sources (Epic 018 S2) — dashboard-managed ──
      # The enabled adapter list (e.g. nws,usgs_water,airnow,firms,ridb,nps_alerts)
      # stays dashboard-owned so the operator can flip sources without a deploy.
      # A missing key self-drops just that adapter (never a 500); the kind then
      # reads honestly `not_fetched` and /health's probes_available shows the gap.
      - key: ADVENTURE_LIVE_ADAPTERS
        sync: false
      # NWS is keyless but requires a real contact string as User-Agent.
      - key: NWS_USER_AGENT
        sync: false
      # Agency API keys (Rule #10: secrets live only in the dashboard, never here).
      - key: AIRNOW_API_KEY
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: RIDB_API_KEY
        sync: false
      - key: NPS_API_KEY
        sync: false
