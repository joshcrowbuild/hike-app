name: warm-ping

# Keeps the Render free-tier API warm so the first mobile tap doesn't pay a
# 30–60s cold start (the /plan first-tap-fails bug). A cheap GET /health every
# ~10 min keeps the instance from idling out. This is a stopgap: keeping Render
# warm vs. moving to a paid always-on tier is a separate ops call (R7).
#
# GitHub's scheduled cron is best-effort and often runs late under load — fine
# here, since the 60s client timeout (httpPlanner.ts) covers any cold start that
# still slips through. Override the target with a `WARM_PING_URL` repo variable.
#
# COST CAVEAT (R7 ops call): this repo is private, so GitHub bills Actions minutes
# and rounds each run up to a full minute. At */10 that is ~4,320 runs/month —
# past the 2,000-minute free allowance — so the ping silently stops mid-month once
# the quota is hit. The app still works (the 60s timeout + "Waking the server…"
# copy cover the cold start); the ping is only an optimization. If the minute cost
# is unwelcome, move keep-warm to a free external pinger (UptimeRobot / cron-job.org)
# hitting /health, widen this interval, or move Render to a paid always-on tier.
# Scheduled workflows only fire from the DEFAULT branch — this won't run until merged.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-ping
  cancel-in-progress: true

jobs:
  ping:
    name: ping /health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /health
        env:
          HEALTH_URL: ${{ vars.WARM_PING_URL || 'https://adventure-planner-api.onrender.com/health' }}
        # --max-time 90 outlasts a worst-case cold start; the ping's job is to
        # trigger the wake, not to gate on it, so a slow 200 still counts.
        run: curl -fsS --max-time 90 --retry 2 "$HEALTH_URL" -o /dev/null -w "%{http_code}\n"
