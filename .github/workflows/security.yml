name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Phase B CI security scanning (path-to-complete §Phase B). bandit,
# secret-scan, and pip-audit are all BLOCKING: bandit/gitleaks historical
# findings are triaged to zero (B324 sha1 call sites carry
# usedforsecurity=False, the B310 urlopen sites carry audited nosec markers,
# and .gitleaks.toml value-pins the known dummy test credentials), and
# pip-audit audits the committed lockfile (requirements.txt — every
# transitive pinned; 2026-07-12 review lane 5), which passed clean at flip
# time. Regenerate the lockfile after a dependency change with:
#   uv pip compile pyproject.toml --all-extras -o requirements.txt --python-version 3.11
jobs:
  # Path detector (mirrors ci.yml). bandit/pip-audit are required checks, so they
  # always RUN and report, but skip their Python scan STEPS on frontend-only PRs.
  # secret-scan always runs (full-history leak scan; cheap, security-critical).
  changes:
    name: changes (security)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.f.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            files=$(git diff --name-only "$base"...HEAD 2>/dev/null || true)
          else
            files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          fi
          be=false
          if printf '%s\n' "$files" | grep -qE '^(api|orchestration|ingestion|graph|evals|regions|scripts|tests)/|\.py$|^pyproject\.toml$|^requirements\.txt$|^conftest\.py$'; then be=true; fi
          if printf '%s\n' "$files" | grep -qE '^\.github/'; then be=true; fi
          if [ -z "$files" ]; then be=true; fi
          echo "backend=$be" >> "$GITHUB_OUTPUT"
          echo "resolved -> backend=$be"

  bandit:
    name: bandit
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        if: needs.changes.outputs.backend == 'true'
        with:
          python-version: "3.11"
      - if: needs.changes.outputs.backend == 'true'
        run: python -m pip install --upgrade pip bandit
      # Same package set as `make typecheck`, plus scripts/. Tests are
      # excluded: bandit's assert/hardcoded-password rules are noise there.
      # Blocking at medium+ severity; the remaining LOW findings (asserts,
      # subprocess-with-fixed-argv in scripts/) are accepted as noise.
      - if: needs.changes.outputs.backend == 'true'
        run: bandit -r api graph ingestion orchestration evals scripts --severity-level medium

  pip-audit:
    name: pip-audit
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        if: needs.changes.outputs.backend == 'true'
        with:
          python-version: "3.11"
      - if: needs.changes.outputs.backend == 'true'
        run: python -m pip install --upgrade pip pip-audit
      # Audit the committed lockfile: it resolves ALL extras, so serve-time and
      # ingestion dependencies are both covered without installing the heavy
      # geo stack. --no-deps because the file is already a complete transitive
      # closure — nothing needs re-resolving.
      - if: needs.changes.outputs.backend == 'true'
        run: pip-audit -r requirements.txt --no-deps

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so gitleaks scans past commits, not just the tip.
          fetch-depth: 0
      # Blocking: gitleaks picks up .gitleaks.toml at the repo root, which
      # value-pins the known dummy test credentials (verified clean over the
      # full commit history at flip time). Runs the MIT-licensed gitleaks CLI
      # directly — gitleaks-action@v2 refuses organization accounts without a
      # paid GITLEAKS_LICENSE (its failure on PR #160 was the license gate,
      # not a leak); the CLI itself has no such gate. Version pinned +
      # checksum-verified.
      - name: Run gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -sSfL -o checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}$" checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
