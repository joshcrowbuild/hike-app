name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Phase B CI security scanning (path-to-complete §Phase B). bandit and
# secret-scan are BLOCKING: their historical findings are triaged to zero
# (B324 sha1 call sites carry usedforsecurity=False, the B310 urlopen sites
# carry audited nosec markers, and .gitleaks.toml value-pins the known dummy
# test credentials). pip-audit stays ADVISORY (continue-on-error): it flags
# unpinned transitive deps we don't control release timing for.
jobs:
  bandit:
    name: bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip bandit
      # Same package set as `make typecheck`, plus scripts/. Tests are
      # excluded: bandit's assert/hardcoded-password rules are noise there.
      # Blocking at medium+ severity; the remaining LOW findings (asserts,
      # subprocess-with-fixed-argv in scripts/) are accepted as noise.
      - run: bandit -r api graph ingestion orchestration evals scripts --severity-level medium

  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip pip-audit
      # Audit the full resolved environment (all extras) so serve-time and
      # ingestion dependencies are both covered. --skip-editable skips the
      # local adventure-planner package itself (not on PyPI).
      - run: python -m pip install -e ".[all]"
      - run: pip-audit --skip-editable

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so gitleaks scans past commits, not just the tip.
          fetch-depth: 0
      # Blocking: gitleaks picks up .gitleaks.toml at the repo root, which
      # value-pins the known dummy test credentials (verified clean over the
      # full commit history at flip time). Runs the MIT-licensed gitleaks CLI
      # directly — gitleaks-action@v2 refuses organization accounts without a
      # paid GITLEAKS_LICENSE (its failure on PR #160 was the license gate,
      # not a leak); the CLI itself has no such gate. Version pinned +
      # checksum-verified.
      - name: Run gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -sSfL -o checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}$" checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
