name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  docs-lint:
    name: docs-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Fails on a stale epic index, known wrong-memory markers, or broken doc links.
      - run: python scripts/doc_lint.py

  check:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [format-check, lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: make ${{ matrix.target }}

  eval-replay:
    # The source-or-silence regression gate (Epic 009, golden-trip + cassette half):
    # runs the REAL engine against recorded corpus + condition cassettes — hermetic
    # (no network, no Neo4j, no API key) — and reds the build if any truthfulness
    # invariant's pass rate drops below 1.0.
    name: eval-replay (source-or-silence)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: make eval-replay

  frontend:
    name: frontend (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Design tokens are generated (Style Dictionary) — the vanilla-extract
      # styles import them, so tests can't collect without this step.
      - run: npm run tokens
      - run: npm run test:coverage
      - name: Upload coverage report
        # always(): a red test run is exactly when the partial coverage report is
        # most useful; if-no-files-found keeps a pre-coverage crash from double-failing.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

  integration:
    name: integration (neo4j)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        # Neo4j 2025 with CYPHER_25 as the default query language mirrors what Aura
        # runs in production, so this leg catches Cypher-25-only regressions (e.g. the
        # pattern-comprehension /health bug that returned graph=null on Aura but passed
        # under Cypher 5). The job name stays "integration (neo4j)" (the required check).
        image: neo4j:2025-community
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_db_query_default__language: CYPHER_25
        ports:
          - 7687:7687
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # graph extra pulls the neo4j driver — the default `test` leg deliberately does not.
      - run: python -m pip install -e ".[dev,graph]"
      - name: Wait for Neo4j bolt
        run: |
          python - <<'PY'
          import time

          import neo4j

          for attempt in range(60):
              try:
                  driver = neo4j.GraphDatabase.driver(
                      "bolt://localhost:7687", auth=("neo4j", "testpassword")
                  )
                  driver.verify_connectivity()
                  driver.close()
                  print(f"neo4j ready after ~{attempt * 2}s")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("neo4j did not become ready")
          PY
      - name: Run owner-isolation integration tests
        run: pytest -m neo4j
