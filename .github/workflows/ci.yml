name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path detector for the monorepo. Every heavy job below is a REQUIRED check, so
  # none of them may be skipped at the job level (a skipped required check blocks
  # the PR forever). Instead each job always RUNS and reports, but gates its
  # expensive install/build/test STEPS on these outputs — near-zero work when its
  # side of the tree didn't change. Fail-safe: a workflow/build-infra change, an
  # unresolvable diff, or an empty diff runs BOTH legs, so a real change can never
  # slip through untested (no false green).
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            files=$(git diff --name-only "$base"...HEAD 2>/dev/null || true)
          else
            files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          fi
          echo "changed files:"; printf '%s\n' "$files"
          be=false; fe=false
          if printf '%s\n' "$files" | grep -qE '^(api|orchestration|ingestion|graph|evals|regions|scripts|tests)/|\.py$|^pyproject\.toml$|^Makefile$|^requirements\.txt$|^conftest\.py$'; then be=true; fi
          if printf '%s\n' "$files" | grep -qE '^frontend/'; then fe=true; fi
          if printf '%s\n' "$files" | grep -qE '^\.github/'; then be=true; fe=true; fi
          if [ -z "$files" ]; then be=true; fe=true; fi
          echo "backend=$be" >> "$GITHUB_OUTPUT"
          echo "frontend=$fe" >> "$GITHUB_OUTPUT"
          echo "resolved -> backend=$be frontend=$fe"

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  docs-lint:
    name: docs-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Fails on a stale epic index, known wrong-memory markers, or broken doc links.
      - run: python scripts/doc_lint.py

  owned-read-lint:
    name: owned-read-lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: needs.changes.outputs.backend == 'true'
        with:
          python-version: "3.11"
      # Rule #4: all owned-label Cypher reads must be scoped to owner_id (no convention).
      - if: needs.changes.outputs.backend == 'true'
        run: python scripts/lint_owned_reads.py

  check:
    name: ${{ matrix.target }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [format-check, lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: needs.changes.outputs.backend == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: needs.changes.outputs.backend == 'true'
        run: python -m pip install --upgrade pip
      - if: needs.changes.outputs.backend == 'true'
        run: python -m pip install -e ".[dev]"
      - if: needs.changes.outputs.backend == 'true'
        run: make ${{ matrix.target }}

  eval-replay:
    # The source-or-silence regression gate (Epic 009, golden-trip + cassette half):
    # runs the REAL engine against recorded corpus + condition cassettes — hermetic
    # (no network, no Neo4j, no API key) — and reds the build if any truthfulness
    # invariant's pass rate drops below 1.0.
    name: eval-replay (source-or-silence)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: needs.changes.outputs.backend == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: needs.changes.outputs.backend == 'true'
        run: python -m pip install --upgrade pip
      - if: needs.changes.outputs.backend == 'true'
        run: python -m pip install -e ".[dev]"
      - if: needs.changes.outputs.backend == 'true'
        run: make eval-replay

  frontend:
    name: frontend (vitest)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: needs.changes.outputs.frontend == 'true'
        run: npm ci
      # Design tokens are generated (Style Dictionary) — the vanilla-extract
      # styles import them, so tests can't collect without this step.
      - if: needs.changes.outputs.frontend == 'true'
        run: npm run tokens
      - if: needs.changes.outputs.frontend == 'true'
        run: npm run test:coverage
      - name: Upload coverage report
        # always(): a red test run is exactly when the partial coverage report is
        # most useful; if-no-files-found keeps a pre-coverage crash from double-failing.
        if: always() && needs.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

  a11y:
    # The Phase-B a11y baseline gate: axe over every story of the
    # safety-relevant honesty primitives (Confidence / Signal / Staleness),
    # composed via composeStories so the real story args are what's audited.
    # BLOCKING — the surface was axe-clean at introduction, and the harness
    # was falsification-checked (a planted alt-less <img> trips it).
    name: a11y (axe, safety stories)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: needs.changes.outputs.frontend == 'true'
        run: npm ci
      # Generated design tokens — the vanilla-extract styles import them.
      - if: needs.changes.outputs.frontend == 'true'
        run: npm run tokens
      - if: needs.changes.outputs.frontend == 'true'
        run: npm run test:a11y

  integration:
    name: integration (neo4j)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        # Neo4j 2025 with CYPHER_25 as the default query language mirrors what Aura
        # runs in production, so this leg catches Cypher-25-only regressions (e.g. the
        # pattern-comprehension /health bug that returned graph=null on Aura but passed
        # under Cypher 5). The job name stays "integration (neo4j)" (the required check).
        image: neo4j:2025-community
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_db_query_default__language: CYPHER_25
        ports:
          - 7687:7687
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: needs.changes.outputs.backend == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: needs.changes.outputs.backend == 'true'
        run: python -m pip install --upgrade pip
      # graph extra pulls the neo4j driver — the default `test` leg deliberately does not.
      - if: needs.changes.outputs.backend == 'true'
        run: python -m pip install -e ".[dev,graph]"
      - name: Wait for Neo4j bolt
        if: needs.changes.outputs.backend == 'true'
        run: |
          python - <<'PY'
          import time

          import neo4j

          for attempt in range(60):
              try:
                  driver = neo4j.GraphDatabase.driver(
                      "bolt://localhost:7687", auth=("neo4j", "testpassword")
                  )
                  driver.verify_connectivity()
                  driver.close()
                  print(f"neo4j ready after ~{attempt * 2}s")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("neo4j did not become ready")
          PY
      - name: Run owner-isolation integration tests
        if: needs.changes.outputs.backend == 'true'
        run: pytest -m neo4j
