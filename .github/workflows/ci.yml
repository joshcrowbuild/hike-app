name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  check:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [format-check, lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: make ${{ matrix.target }}

  integration:
    name: integration (neo4j)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # graph extra pulls the neo4j driver — the default `test` leg deliberately does not.
      - run: python -m pip install -e ".[dev,graph]"
      - name: Wait for Neo4j bolt
        run: |
          python - <<'PY'
          import time

          import neo4j

          for attempt in range(60):
              try:
                  driver = neo4j.GraphDatabase.driver(
                      "bolt://localhost:7687", auth=("neo4j", "testpassword")
                  )
                  driver.verify_connectivity()
                  driver.close()
                  print(f"neo4j ready after ~{attempt * 2}s")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("neo4j did not become ready")
          PY
      - name: Run owner-isolation integration tests
        run: pytest -m neo4j
